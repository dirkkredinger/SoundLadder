<h2>SoundLadder</h2>
<p>Decide in which order your audio output devices are used.
If your preferred device isn't connected, the app automatically switches to the next one in the list.</p>
<p>The app is installed into the <b>Applications</b> folder and then appears as an icon in the menu bar.</p>
