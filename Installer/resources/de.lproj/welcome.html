<h2>SoundLadder</h2>
<p>Lege fest, in welcher Reihenfolge deine Audio-Ausgabegeräte verwendet werden.
Ist das bevorzugte Gerät nicht angeschlossen, wechselt die App automatisch zum nächsten in der Liste.</p>
<p>Die App wird in den Ordner <b>Programme</b> installiert und erscheint danach als Symbol in der Menüleiste.</p>
